name: Tests and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Python tests (pipeline, chatbot, export, site files)
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser chatbot tests (must answer exactly like Python)
        run: node --test

  eval:
    # CI regression gate: router + search checks on the golden set (no Ollama), compared with a CI-only
    # baseline. Defined in https://github.com/saeedelgaml/llm-regression-detection
    uses: saeedelgaml/llm-regression-detection/.github/workflows/eval.yml@main
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  deploy:
    # Only the main branch is published, and only when every test and the regression gate passed.
    needs: [test, eval]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the evaluation report at /eval/ (built by the eval job only when the gate passed)
        uses: actions/download-artifact@v4
        with:
          name: eval-report
          path: site/eval
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
